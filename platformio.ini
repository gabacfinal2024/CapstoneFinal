; AgriResQ ESP32-CAM firmware (src/main.cpp)
; Build & flash:  pio run -t upload   |  serial log:  pio device monitor
; The operator sets up Wi-Fi from the AgriResQ app (docs/IOT_DEVICE_API.md);
; nothing in this project needs editing per stall.

[env:ai_thinker_esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=1
lib_ldf_mode = deep+
lib_deps =
	espressif/esp32-camera
	bblanchon/ArduinoJson @ ^7.2.0
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14
