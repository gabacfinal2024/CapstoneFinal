services:
  - type: web
    name: agriresq
    runtime: python
    buildCommand: pip install -r agriresq_core/requirements.txt
    startCommand: python agriresq_core/manage.py migrate --noinput && gunicorn --bind 0.0.0.0:$PORT --chdir agriresq_core agriresq_backend.wsgi:application
    envVars:
      - key: DEVICE_SERVER_URL
        value: https://agriresq.onrender.com
