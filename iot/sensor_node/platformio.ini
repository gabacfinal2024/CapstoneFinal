; AgriResQ sensor node (plain ESP32 DevKit + DHT22).  Build & flash: pio run -t upload   |  serial: pio device monitor
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14
